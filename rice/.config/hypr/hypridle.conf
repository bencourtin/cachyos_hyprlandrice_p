# hypridle — gestión de inactividad
# Portado de binnewbs/arch-hyprland, adaptado al rice.

general {
    lock_cmd       = pidof hyprlock || hyprlock       # evita instancias duplicadas
    before_sleep_cmd = loginctl lock-session          # bloquea antes de suspender
    after_sleep_cmd  = hyprctl dispatch dpms on       # enciende pantalla al volver
    ignore_dbus_inhibit = false                       # respeta inhibidores (mpv, etc.)
}

# (Desktop: sin listener de brillo — no hay backlight interno)

# 5 min -> bloquea la sesión
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# 5.5 min -> apaga la pantalla
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min -> suspende
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
