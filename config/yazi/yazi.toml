# ~/.config/yazi/yazi.toml — Finder-like setup for the CachyOS + Hyprland rice.
# Colors live in theme.toml (generated by matugen). Keys in keymap.toml.

[mgr]
ratio          = [1, 3, 4]   # parent | current | preview  -> Finder columns
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true         # folders on top, like Finder
linemode       = "size"
show_hidden    = false        # Finder hides dotfiles by default (toggle: .)
show_symlink   = true
scrolloff      = 5

[preview]
image_filter  = "lanczos3"
image_quality = 85
max_width     = 1000
max_height    = 1400

[opener]
edit = [
  { run = '${EDITOR:-micro} "$@"', block = true, desc = "Edit", for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "linux" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, desc = "Play", for = "unix" },
]

[open]
rules = [
  { url = "*/",                                             use = [ "edit", "open" ] },
  { mime = "text/*",                                        use = [ "edit", "open" ] },
  { mime = "image/*",                                       use = [ "open" ] },
  { mime = "{audio,video}/*",                               use = [ "play", "open" ] },
  { mime = "application/pdf",                               use = [ "open" ] },
  { mime = "application/*zip",                              use = [ "open" ] },
  { mime = "application/x-{tar,bzip2,7z-compressed,xz,rar}", use = [ "open" ] },
  { mime = "inode/x-empty",                                 use = [ "edit" ] },
  { mime = "*",                                             use = [ "open" ] },
]
