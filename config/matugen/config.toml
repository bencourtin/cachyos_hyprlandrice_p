# matugen — motor de color del rice (Material You desde wallpaper)
# El wallpaper lo fija ~/.config/hypr/scripts/wallpaper.sh (awww); aquí solo colores.
# Modo dark, esquema tonal-spot (defaults de matugen).

[config]

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/config/colors-matugen.lua'
post_hook   = 'hyprctl reload'

[templates.hyprlock]
input_path  = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.waybar]
input_path  = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook   = 'killall -SIGUSR2 waybar 2>/dev/null || true'

[templates.rofi]
input_path  = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.clima]
input_path  = '~/.config/matugen/templates/clima-colors.json'
output_path = '~/.config/quickshell/clima/colors.json'

[templates.mediactl]
input_path  = '~/.config/matugen/templates/mediactl-colors.json'
output_path = '~/.config/quickshell/mediactl/colors.json'

[templates.keyhints]
input_path  = '~/.config/matugen/templates/keyhints-colors.json'
output_path = '~/.config/quickshell/keyhints/colors.json'

[templates.spicetify]
input_path  = '~/.config/matugen/templates/spicetify-colors.ini'
output_path = '~/.config/spicetify/Themes/text/color.ini'
post_hook   = 'spicetify apply >/dev/null 2>&1 || true'

[templates.discord]
input_path  = '~/.config/matugen/templates/discord-vencord.css'
output_path = '~/.config/Vencord/themes/matugen.css'

[templates.kitty]
input_path  = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/matugen.conf'
post_hook   = 'kill -SIGUSR1 $(pidof kitty) 2>/dev/null || true'

[templates.gtk3]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/matugen.css'

[templates.gtk4]
input_path  = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/matugen.css'

[templates.btop]
input_path  = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.cava]
input_path  = '~/.config/matugen/templates/cava.conf'
output_path = '~/.config/cava/config'
post_hook   = 'pkill -USR1 cava 2>/dev/null || true'

[templates.wlogout]
input_path  = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/wlogout/colors.css'

[templates.swaync]
input_path  = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook   = 'swaync-client -rs 2>/dev/null || true'
