# hyprlock — lockscreen del rice
# Portado de binnewbs/arch-hyprland. Colores vía matugen.

# --- Colores (generados por matugen; fallback dark si aún no existe) ---
$background             = rgba(0f1417ff)
$surface               = rgba(1b2126ff)
$on_surface            = rgba(dfe3e7ff)
$primary               = rgba(86d1e9ff)
$secondary             = rgba(b3cad3ff)
$on_secondary_container = rgba(cee6f0ff)
$source_color          = rgba(0e3c48ff)
source = ~/.config/hypr/hyprlock-colors.conf

# Fuentes
$font       = JetBrainsMono Nerd Font
$font_mono  = JetBrainsMono Nerd Font Mono

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/current_wallpaper
    color = rgb(0,0,0)

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# Minutos
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $on_secondary_container
    font_size = 112
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Día de la semana
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> $(date +'%A') </big></b>"
    color = $secondary
    font_size = 18
    font_family = $font_mono
    position = 0, -15
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:18000000] echo "<b> $(date +'%d %b') </b>"
    color = $secondary
    font_size = 14
    font_family = $font_mono
    position = 0, -40
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = $secondary
    font_size = 14
    font_family = $font_mono
    position = 0, 200
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1

    rounding = 22
    outer_color = $source_color
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $secondary
    fade_on_empty = true
    placeholder_text = <i>Password...</i>

    # Feedback visual: borde ámbar si Caps Lock, azul mientras verifica, rojo si falla
    capslock_color = rgb(f5c211)
    check_color    = $primary
    fail_color     = rgb(e01b24)
    fail_text      = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, 120
    halign = center
    valign = bottom
}
